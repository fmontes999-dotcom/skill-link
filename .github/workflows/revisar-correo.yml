# Alarma del correo de códigos de Skill-Link.
# Cada 6 horas comprueba que Gmail siga aceptando la contraseña de aplicación que usa Supabase
# para enviar los códigos de acceso. No envía ningún correo: solo inicia sesión y se desconecta.
# Si Gmail la rechaza (por ejemplo, porque alguien cambió la contraseña de la cuenta de Google,
# lo que borra todas las contraseñas de aplicación), la ejecución falla y GitHub manda un correo
# de aviso al dueño del repositorio.
#
# Necesita dos secretos en GitHub → Settings → Secrets and variables → Actions:
#   SMTP_USER      el Gmail que envía los códigos (el mismo de Supabase → SMTP Settings)
#   SMTP_PASSWORD  su contraseña de aplicación, la misma que está en Supabase
# Si se cambia la contraseña en Supabase, hay que actualizarla también aquí.

name: Revisar correo de códigos

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  gmail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Iniciar sesión en Gmail con la contraseña de aplicación
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASSWORD" ]; then
            echo "::warning::Faltan los secretos SMTP_USER y SMTP_PASSWORD: la alarma del correo no está activa."
            exit 0
          fi
          python3 - <<'PY'
          import os, smtplib, sys

          try:
              with smtplib.SMTP("smtp.gmail.com", 587, timeout=30) as smtp:
                  smtp.starttls()
                  smtp.login(os.environ["SMTP_USER"], os.environ["SMTP_PASSWORD"].replace(" ", ""))
          except smtplib.SMTPAuthenticationError:
              print("::error::Gmail rechazó la contraseña de aplicación: los códigos de acceso de Skill-Link NO se están enviando. "
                    "Crea una nueva en https://myaccount.google.com/apppasswords y pégala en Supabase "
                    "(Authentication → Emails → SMTP Settings) y en el secreto SMTP_PASSWORD de este repositorio.")
              sys.exit(1)
          except Exception as error:
              print(f"::error::No se pudo conectar con Gmail: {error}")
              sys.exit(1)
          print("Gmail acepta la contraseña de aplicación: el correo de códigos funciona.")
          PY
